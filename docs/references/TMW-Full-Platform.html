    .incoming-call-actions .btn { flex: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Utilities */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: var(--space-2); }
    .gap-3 { gap: var(--space-3); }
    .gap-4 { gap: var(--space-4); }
    .mt-2 { margin-top: var(--space-2); }
    .mt-4 { margin-top: var(--space-4); }
    .mb-2 { margin-bottom: var(--space-2); }
    .mb-4 { margin-bottom: var(--space-4); }
    .ml-auto { margin-left: auto; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.875rem; }
    .text-muted { color: var(--text-secondary); }
    .font-semibold { font-weight: 600; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

    // ========================================
    // CONSTANTS
    // ========================================
    const NAVIGATION = [
      { id: 'dashboard', icon: '📊', label: 'Dashboard' },
      { id: 'email', icon: '📧', label: 'Email' },
      { id: 'chat', icon: '💬', label: 'Chat' },
      { id: 'radio', icon: '🤖', label: 'Radio Chat' },
      { id: 'tasks', icon: '✅', label: 'Tasks' },
      { id: 'calendar', icon: '📅', label: 'Calendar' },
      { id: 'contacts', icon: '👥', label: 'Contacts' },
      { id: 'settings', icon: '⚙️', label: 'Settings' }
    ];

    const AI_AGENTS = [
      { id: 'claude', name: 'Claude', provider: 'Anthropic', icon: '🧡', status: 'Online' },
      { id: 'gpt', name: 'ChatGPT', provider: 'OpenAI', icon: '💚', status: 'Online' },
      { id: 'gemini', name: 'Gemini', provider: 'Google', icon: '💙', status: 'Online' }
    ];

    const TASK_FILTERS = [
      { id: 'all', label: 'All Tasks', icon: '📋' },
      { id: 'today', label: 'Today', icon: '📆' },
      { id: 'upcoming', label: 'Upcoming', icon: '⏰' },
      { id: 'completed', label: 'Completed', icon: '✅' },
      { id: 'high', label: 'High Priority', icon: '🔴' }
    ];

    const SETTINGS_NAV = [
      { id: 'profile', label: 'Profile', icon: '👤' },
      { id: 'notifications', label: 'Notifications', icon: '🔔' },
      { id: 'appearance', label: 'Appearance', icon: '🎨' },
      { id: 'privacy', label: 'Privacy', icon: '🔒' },
      { id: 'integrations', label: 'Integrations', icon: '🔗' }
    ];

    // ========================================
    // UTILITIES
    // ========================================
    const getInitials = (name) => name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    const formatTime = (date) => new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const formatDate = (date) => new Date(date).toLocaleDateString([], { month: 'short', day: 'numeric' });
    const formatCallTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

    // ========================================
    // MOCK DATA
    // ========================================
    const generateEmails = () => [
      { id: 1, from: { name: 'John Smith', email: 'john@company.com' }, subject: 'Q4 Project Update', body: 'Hi Team,\n\nHere are the latest updates on our Q4 project...', time: new Date(Date.now() - 3600000), unread: true, starred: true, folder: 'inbox', attachments: [{ name: 'Report.pdf', size: '2.4 MB' }] },
      { id: 2, from: { name: 'Sarah Connor', email: 'sarah@company.com' }, subject: 'Meeting Reschedule', body: 'Hi,\n\nCould we move our meeting to 4pm?', time: new Date(Date.now() - 7200000), unread: true, starred: false, folder: 'inbox', attachments: [] },
      { id: 3, from: { name: 'Tech Support', email: 'support@service.com' }, subject: 'Ticket #4521 Resolved', body: 'Your support ticket has been resolved.', time: new Date(Date.now() - 86400000), unread: false, starred: false, folder: 'inbox', attachments: [] },
      { id: 4, from: { name: 'Marketing', email: 'marketing@company.com' }, subject: 'Campaign Results', body: 'Here are the campaign results...', time: new Date(Date.now() - 172800000), unread: false, starred: true, folder: 'inbox', attachments: [{ name: 'Stats.xlsx', size: '1.2 MB' }] }
    ];

    const generateMessages = () => [
      { id: 1, roomId: 'general', sender: { id: '2', name: 'Alice' }, text: 'Good morning! 👋', time: new Date(Date.now() - 3600000) },
      { id: 2, roomId: 'general', sender: { id: '3', name: 'Bob' }, text: 'Morning! Ready for standup?', time: new Date(Date.now() - 3500000) },
      { id: 3, roomId: 'general', sender: { id: '1', name: 'You' }, text: 'Yes, finishing code review', time: new Date(Date.now() - 3400000) }
    ];

    const generateUsers = () => [
      { id: '2', name: 'Alice Johnson', email: 'alice@company.com', status: 'online', statusText: 'Working on API', phone: '+1 555-0101', company: 'TMW Corp', role: 'Developer' },
      { id: '3', name: 'Bob Smith', email: 'bob@company.com', status: 'online', statusText: 'In a meeting', phone: '+1 555-0102', company: 'TMW Corp', role: 'PM' },
      { id: '4', name: 'Carol White', email: 'carol@company.com', status: 'away', statusText: 'Back in 30min', phone: '+1 555-0103', company: 'TMW Corp', role: 'Designer' },
      { id: '5', name: 'David Brown', email: 'david@company.com', status: 'busy', statusText: 'Do not disturb', phone: '+1 555-0104', company: 'TMW Corp', role: 'DevOps' }
    ];

    const generateTasks = () => [
      { id: 1, title: 'Review API Documentation', description: 'Go through the new API docs and provide feedback', completed: false, priority: 'high', dueDate: new Date(Date.now() + 86400000), tags: ['api', 'docs'] },
      { id: 2, title: 'Fix Login Bug', description: 'Users unable to login with SSO', completed: false, priority: 'high', dueDate: new Date(Date.now() + 43200000), tags: ['bug', 'auth'] },
      { id: 3, title: 'Update Dependencies', description: 'Update npm packages to latest versions', completed: true, priority: 'medium', dueDate: new Date(Date.now() - 86400000), tags: ['maintenance'] },
      { id: 4, title: 'Design Review Meeting', description: 'Review new dashboard designs with team', completed: false, priority: 'medium', dueDate: new Date(Date.now() + 172800000), tags: ['meeting', 'design'] },
      { id: 5, title: 'Write Unit Tests', description: 'Add tests for user service', completed: false, priority: 'low', dueDate: new Date(Date.now() + 259200000), tags: ['testing'] }
    ];

    const generateCalendarEvents = () => [
      { id: 1, title: 'Team Standup', type: 'meeting', date: new Date(), time: '09:00' },
      { id: 2, title: 'API Review', type: 'task', date: new Date(), time: '14:00' },
      { id: 3, title: 'Client Call', type: 'meeting', date: new Date(Date.now() + 86400000), time: '10:00' },
      { id: 4, title: 'Deploy v2.0', type: 'reminder', date: new Date(Date.now() + 172800000), time: '16:00' }
    ];

    // AI Response Simulation
    const simulateAIResponse = (agent, message) => new Promise(resolve => {
      const responses = {
        claude: `I've analyzed your request carefully. Here's my perspective:\n\nRegarding "${message.slice(0, 40)}...":\n\nThis is an interesting topic that requires careful consideration. Let me break it down:\n\n1. First, we should consider the context\n2. Then, analyze the key factors\n3. Finally, provide actionable recommendations\n\nWould you like me to elaborate on any of these points?`,
        gpt: `Great question! Here's what I can help you with:\n\nBased on "${message.slice(0, 40)}...":\n\nI've processed your request and here are my thoughts:\n\n• Key insight #1: Understanding the fundamentals\n• Key insight #2: Practical applications\n• Key insight #3: Best practices to follow\n\nLet me know if you need more details!`,
        gemini: `I've analyzed your query using my multimodal capabilities.\n\nFor "${message.slice(0, 40)}...":\n\nHere's a comprehensive response:\n\n**Analysis:**\nYour question touches on several important aspects that I can help clarify.\n\n**Recommendation:**\nBased on current best practices, I suggest the following approach...\n\nShall I provide more specific guidance?`
      };
      setTimeout(() => resolve(responses[agent] || responses.claude), 1500 + Math.random() * 1500);
    });

    // ========================================
    // VUE APPLICATION
    // ========================================
    const App = {
      setup() {
        // Navigation
        const activeView = ref('dashboard');
        const currentUser = ref({ id: '1', name: 'Luca', email: 'lucaarcana@gmail.com' });

        // Email State
        const emails = ref(generateEmails());
        const activeFolder = ref('inbox');
        const selectedEmail = ref(null);
        const emailSearch = ref('');
        const showComposeModal = ref(false);
        const composeData = reactive({ to: '', subject: '', body: '' });

        const filteredEmails = computed(() => {
          let list = emails.value.filter(e => e.folder === activeFolder.value);
          if (emailSearch.value) {
            const q = emailSearch.value.toLowerCase();
            list = list.filter(e => e.subject.toLowerCase().includes(q) || e.from.name.toLowerCase().includes(q));
          }
          return list.sort((a, b) => new Date(b.time) - new Date(a.time));
        });

        // Chat State
        const chatRooms = ref([
          { id: 'general', name: 'General', icon: '💬', unread: 2 },
          { id: 'team', name: 'Team', icon: '👥', unread: 0 },
          { id: 'projects', name: 'Projects', icon: '📁', unread: 1 }
        ]);
        const activeChatRoom = ref('general');
        const messages = ref(generateMessages());
        const newMessage = ref('');
        const onlineUsers = ref(generateUsers());
        const typingUsers = ref([]);

        const roomMessages = computed(() => messages.value.filter(m => m.roomId === activeChatRoom.value));

        const sendChatMessage = () => {
          if (!newMessage.value.trim()) return;
          messages.value.push({ id: generateId(), roomId: activeChatRoom.value, sender: { id: '1', name: 'You' }, text: newMessage.value.trim(), time: new Date() });
          newMessage.value = '';
          // Simulate response
          setTimeout(() => {
            typingUsers.value = ['Alice'];
            setTimeout(() => {
              typingUsers.value = [];
              messages.value.push({ id: generateId(), roomId: activeChatRoom.value, sender: { id: '2', name: 'Alice' }, text: 'Got it, thanks! 👍', time: new Date() });
            }, 1500);
          }, 500);
        };

        // Radio Chat State
        const activeAgent = ref('claude');
        const radioMessages = ref([]);
        const radioInput = ref('');
        const radioLoading = ref(false);
        const radioHistory = ref([
          { id: 1, title: 'Code Review Discussion', agent: 'claude', time: new Date(Date.now() - 86400000) },
          { id: 2, title: 'API Architecture', agent: 'gpt', time: new Date(Date.now() - 172800000) }
        ]);

        const sendRadioMessage = async () => {
          if (!radioInput.value.trim() || radioLoading.value) return;
          const userMsg = radioInput.value.trim();
          radioMessages.value.push({ id: generateId(), role: 'user', content: userMsg, time: new Date() });
          radioInput.value = '';
          radioLoading.value = true;
          try {
            const response = await simulateAIResponse(activeAgent.value, userMsg);
            radioMessages.value.push({ id: generateId(), role: 'assistant', agent: activeAgent.value, content: response, time: new Date(), tokens: { input: Math.floor(userMsg.length / 4), output: Math.floor(response.length / 4) }, responseTime: Math.floor(1500 + Math.random() * 1500) });
          } catch (e) { console.error(e); }
          radioLoading.value = false;
        };

        // Tasks State
        const tasks = ref(generateTasks());
        const taskFilter = ref('all');
        const showTaskModal = ref(false);
        const newTask = reactive({ title: '', description: '', priority: 'medium', dueDate: '' });

        const filteredTasks = computed(() => {
          let list = tasks.value;
          switch (taskFilter.value) {
            case 'today': list = list.filter(t => !t.completed && new Date(t.dueDate).toDateString() === new Date().toDateString()); break;
            case 'upcoming': list = list.filter(t => !t.completed && new Date(t.dueDate) > new Date()); break;
            case 'completed': list = list.filter(t => t.completed); break;
            case 'high': list = list.filter(t => !t.completed && t.priority === 'high'); break;
          }
          return list;
        });

        const toggleTask = (task) => { task.completed = !task.completed; };
        const addTask = () => {
          if (!newTask.title) return;
          tasks.value.push({ id: generateId(), ...newTask, completed: false, tags: [] });
          Object.assign(newTask, { title: '', description: '', priority: 'medium', dueDate: '' });
          showTaskModal.value = false;
        };

        // Calendar State
        const currentMonth = ref(new Date());
        const calendarEvents = ref(generateCalendarEvents());
        const selectedDate = ref(new Date());

        const calendarDays = computed(() => {
          const year = currentMonth.value.getFullYear();
          const month = currentMonth.value.getMonth();
          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const days = [];
          const startPad = firstDay.getDay();
          for (let i = startPad - 1; i >= 0; i--) days.push({ date: new Date(year, month, -i), otherMonth: true });
          for (let i = 1; i <= lastDay.getDate(); i++) days.push({ date: new Date(year, month, i), otherMonth: false });
          const endPad = 42 - days.length;
          for (let i = 1; i <= endPad; i++) days.push({ date: new Date(year, month + 1, i), otherMonth: true });
          return days;
        });

        const getEventsForDate = (date) => calendarEvents.value.filter(e => new Date(e.date).toDateString() === date.toDateString());

        // Contacts State
        const contacts = ref(generateUsers());
        const contactSearch = ref('');
        const selectedContact = ref(null);
        const showAddContactModal = ref(false);

        const filteredContacts = computed(() => {
          if (!contactSearch.value) return contacts.value;
          const q = contactSearch.value.toLowerCase();
          return contacts.value.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
        });

        // Settings State
        const activeSettingsTab = ref('profile');
        const settings = reactive({
          emailNotifications: true,
          pushNotifications: true,
          darkMode: true,
          compactMode: false,
          soundEffects: true
        });

        // Notifications
        const notifications = ref([
          { id: 1, title: 'New Email', text: 'John Smith sent you a message', time: new Date(Date.now() - 300000), unread: true, icon: '📧' },
          { id: 2, title: 'Task Due', text: 'Review API Documentation is due today', time: new Date(Date.now() - 3600000), unread: true, icon: '✅' },
          { id: 3, title: 'Meeting Reminder', text: 'Team standup in 15 minutes', time: new Date(Date.now() - 7200000), unread: false, icon: '📅' }
        ]);
        const showNotifications = ref(false);
        const unreadNotifications = computed(() => notifications.value.filter(n => n.unread).length);

        // Call State
        const callState = reactive({ active: false, type: null, peer: null, muted: false, duration: 0, status: 'idle' });
        const incomingCall = ref(null);
        let callTimer = null;

        const startCall = (user, type) => {
          Object.assign(callState, { active: true, type, peer: user, muted: false, duration: 0, status: 'calling' });
          setTimeout(() => { if (callState.active) { callState.status = 'connected'; callTimer = setInterval(() => callState.duration++, 1000); } }, 2000);
        };
        const endCall = () => {
          if (callTimer) { clearInterval(callTimer); callTimer = null; }
          Object.assign(callState, { active: false, type: null, peer: null, muted: false, duration: 0, status: 'idle' });
        };
        const toggleMute = () => { callState.muted = !callState.muted; };
        const answerCall = () => {
          if (!incomingCall.value) return;
          Object.assign(callState, { active: true, type: incomingCall.value.type, peer: incomingCall.value.caller, status: 'connected' });
          incomingCall.value = null;
          callTimer = setInterval(() => callState.duration++, 1000);
        };
        const rejectCall = () => { incomingCall.value = null; };

        // Toast
        const toasts = ref([]);
        const showToast = (message, type = 'info') => {
          const id = generateId();
          toasts.value.push({ id, message, type });
          setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 3000);
        };

        // Dashboard Stats
        const dashboardStats = computed(() => [
          { icon: '📧', value: emails.value.filter(e => e.unread).length, label: 'Unread Emails', color: 'hsl(239, 84%, 67%)' },
          { icon: '✅', value: tasks.value.filter(t => !t.completed).length, label: 'Pending Tasks', color: 'hsl(142, 70%, 45%)' },
          { icon: '💬', value: messages.value.length, label: 'Messages', color: 'hsl(38, 92%, 50%)' },
          { icon: '📅', value: calendarEvents.value.length, label: 'Events', color: 'hsl(280, 70%, 55%)' },
          { icon: '🤖', value: radioHistory.value.length, label: 'AI Chats', color: 'hsl(25, 95%, 53%)' },
          { icon: '👥', value: onlineUsers.value.filter(u => u.status === 'online').length, label: 'Online', color: 'hsl(200, 80%, 50%)' }
        ]);

        // Nav badges
        const navBadges = computed(() => ({
          email: emails.value.filter(e => e.unread).length,
          chat: chatRooms.value.reduce((sum, r) => sum + r.unread, 0),
          tasks: tasks.value.filter(t => !t.completed && t.priority === 'high').length
        }));

        onUnmounted(() => { if (callTimer) clearInterval(callTimer); });

        return {
          NAVIGATION, AI_AGENTS, TASK_FILTERS, SETTINGS_NAV,
          activeView, currentUser,
          emails, activeFolder, selectedEmail, emailSearch, filteredEmails, showComposeModal, composeData,
          chatRooms, activeChatRoom, messages: roomMessages, newMessage, onlineUsers, typingUsers, sendChatMessage,
          activeAgent, radioMessages, radioInput, radioLoading, radioHistory, sendRadioMessage,
          tasks, taskFilter, filteredTasks, showTaskModal, newTask, toggleTask, addTask,
          currentMonth, calendarDays, calendarEvents, selectedDate, getEventsForDate,
          contacts: filteredContacts, contactSearch, selectedContact, showAddContactModal,
          activeSettingsTab, settings,
          notifications, showNotifications, unreadNotifications,
          callState, incomingCall, startCall, endCall, toggleMute, answerCall, rejectCall,
          toasts, showToast, dashboardStats, navBadges,
          getInitials, formatTime, formatDate, formatCallTime
        };
      },

      template: `
        <div class="app-container">
          <!-- Sidebar -->
          <nav class="sidebar">
            <div class="avatar" style="margin-bottom: var(--space-4); cursor: pointer" @click="activeView = 'settings'">{{ getInitials(currentUser.name) }}</div>
            <div class="nav-divider"></div>
            <button v-for="item in NAVIGATION" :key="item.id" :class="['nav-item', { active: activeView === item.id }]" :title="item.label" @click="activeView = item.id">
              {{ item.icon }}
              <span v-if="navBadges[item.id]" class="nav-badge">{{ navBadges[item.id] }}</span>
            </button>
          </nav>

          <!-- Main -->
          <main class="main-content">
            <header class="header">
              <h1 class="header-title">{{ NAVIGATION.find(n => n.id === activeView)?.icon }} {{ NAVIGATION.find(n => n.id === activeView)?.label }}</h1>
              <div class="header-actions">
                <button class="btn btn-icon btn-ghost" @click="showNotifications = !showNotifications" style="position: relative">
                  🔔
                  <span v-if="unreadNotifications" class="nav-badge" style="top: -4px; right: -4px">{{ unreadNotifications }}</span>
                </button>
                <div class="avatar avatar-sm">{{ getInitials(currentUser.name) }}</div>
              </div>
            </header>

            <div class="content-area">
              <!-- DASHBOARD -->
              <div v-if="activeView === 'dashboard'" class="animate-fade-in">
                <div class="dashboard-grid">
                  <div v-for="(stat, i) in dashboardStats" :key="i" class="stat-card">
                    <div class="stat-icon" :style="{ background: stat.color + '20', color: stat.color }">{{ stat.icon }}</div>
                    <div><div class="stat-value">{{ stat.value }}</div><div class="stat-label">{{ stat.label }}</div></div>
                  </div>
                </div>
                <div class="flex gap-4">
                  <div class="card flex-1">
                    <div class="card-header">Recent Tasks</div>
                    <div class="card-body">
                      <div v-for="task in tasks.slice(0, 4)" :key="task.id" class="flex items-center gap-3 mb-3">
                        <div :class="['task-checkbox', { checked: task.completed }]" @click="toggleTask(task)">{{ task.completed ? '✓' : '' }}</div>
                        <span :style="{ textDecoration: task.completed ? 'line-through' : 'none', opacity: task.completed ? 0.5 : 1 }">{{ task.title }}</span>
                        <span :class="['task-priority', task.priority]" class="ml-auto">{{ task.priority }}</span>
                      </div>
                    </div>
                  </div>
                  <div class="card flex-1">
                    <div class="card-header">Upcoming Events</div>
                    <div class="card-body">
                      <div v-for="event in calendarEvents.slice(0, 4)" :key="event.id" class="flex items-center gap-3 mb-3">
                        <span :class="['calendar-event', event.type]" style="padding: 4px 8px">{{ event.type === 'meeting' ? '📅' : event.type === 'task' ? '✅' : '⏰' }}</span>
                        <div><div class="font-semibold">{{ event.title }}</div><div class="text-sm text-muted">{{ formatDate(event.date) }} at {{ event.time }}</div></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- EMAIL -->
              <div v-if="activeView === 'email'" class="email-layout animate-fade-in">
                <aside class="email-sidebar">
                  <button class="btn btn-primary email-compose-btn" @click="showComposeModal = true">✏️ Compose</button>
                  <div v-for="folder in [{id:'inbox',label:'Inbox',icon:'📥'},{id:'starred',label:'Starred',icon:'⭐'},{id:'sent',label:'Sent',icon:'📤'},{id:'drafts',label:'Drafts',icon:'📝'},{id:'trash',label:'Trash',icon:'🗑️'}]" :key="folder.id" :class="['email-folder', { active: activeFolder === folder.id }]" @click="activeFolder = folder.id">
                    <span>{{ folder.icon }}</span><span>{{ folder.label }}</span>
                    <span v-if="folder.id === 'inbox'" class="email-folder-count">{{ emails.filter(e => e.folder === 'inbox' && e.unread).length }}</span>
                  </div>
                </aside>
                <div class="email-list">
                  <div class="email-list-header"><input v-model="emailSearch" class="input" placeholder="Search emails..." /></div>
                  <div class="email-list-content">
                    <div v-for="email in filteredEmails" :key="email.id" :class="['email-item', { unread: email.unread, active: selectedEmail?.id === email.id }]" @click="selectedEmail = email; email.unread = false">
                      <span :class="['email-star', { starred: email.starred }]" @click.stop="email.starred = !email.starred">{{ email.starred ? '⭐' : '☆' }}</span>
                      <div class="email-item-content">
                        <div class="flex justify-between"><span class="email-sender">{{ email.from.name }}</span><span class="email-time">{{ formatDate(email.time) }}</span></div>
                        <div class="email-subject">{{ email.subject }}</div>
                        <div class="email-preview">{{ email.body.slice(0, 50) }}...</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="email-detail">
                  <template v-if="selectedEmail">
                    <div class="email-detail-header">
                      <h2 class="email-detail-subject">{{ selectedEmail.subject }}</h2>
                      <div class="email-detail-meta"><div class="avatar avatar-sm">{{ getInitials(selectedEmail.from.name) }}</div><div><div class="font-semibold">{{ selectedEmail.from.name }}</div><div class="text-sm text-muted">{{ selectedEmail.from.email }}</div></div><span class="ml-auto text-muted">{{ formatDate(selectedEmail.time) }}</span></div>
                    </div>
                    <div class="email-detail-actions"><button class="btn btn-secondary btn-sm">↩️ Reply</button><button class="btn btn-secondary btn-sm">↪️ Forward</button><button class="btn btn-secondary btn-sm">📦 Archive</button><button class="btn btn-secondary btn-sm">🗑️ Delete</button></div>
                    <div class="email-detail-body"><p v-for="(p, i) in selectedEmail.body.split('\\n')" :key="i">{{ p }}</p></div>
                    <div v-if="selectedEmail.attachments.length" class="email-attachments"><div class="text-sm font-semibold mb-2">Attachments</div><div v-for="att in selectedEmail.attachments" :key="att.name" class="email-attachment">📎 {{ att.name }} ({{ att.size }})</div></div>
                  </template>
                  <div v-else class="empty-state" style="height:100%;display:flex;align-items:center;justify-content:center"><div><div class="empty-state-icon">📧</div><p>Select an email</p></div></div>
                </div>
              </div>

              <!-- CHAT -->
              <div v-if="activeView === 'chat'" class="chat-layout animate-fade-in">
                <aside class="chat-sidebar">
                  <div class="chat-sidebar-header">Channels <button class="btn btn-icon btn-ghost btn-sm">+</button></div>
                  <div class="chat-rooms-list">
                    <div v-for="room in chatRooms" :key="room.id" :class="['chat-room-item', { active: activeChatRoom === room.id }]" @click="activeChatRoom = room.id; room.unread = 0">
                      <span class="chat-room-icon">{{ room.icon }}</span><div class="chat-room-info"><div class="chat-room-name">{{ room.name }}</div></div>
                      <span v-if="room.unread" class="chat-room-badge">{{ room.unread }}</span>
                    </div>
                  </div>
                </aside>
                <div class="chat-main">
                  <div class="chat-header"><div><h3>{{ chatRooms.find(r => r.id === activeChatRoom)?.icon }} {{ chatRooms.find(r => r.id === activeChatRoom)?.name }}</h3></div><div class="flex gap-2"><button class="btn btn-icon btn-secondary">📞</button><button class="btn btn-icon btn-secondary">📹</button></div></div>
                  <div class="chat-messages">
                    <div v-for="msg in messages" :key="msg.id" :class="['message', { own: msg.sender.id === '1' }]">
                      <div class="avatar avatar-sm">{{ getInitials(msg.sender.name) }}</div>
                      <div class="message-content"><div class="message-sender">{{ msg.sender.name }}</div><div class="message-text">{{ msg.text }}</div><div class="message-time">{{ formatTime(msg.time) }}</div></div>
                    </div>
                    <div v-if="typingUsers.length" class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
                  </div>
                  <div class="chat-input-area"><div class="chat-input-wrapper"><button class="btn btn-icon btn-ghost">📎</button><input v-model="newMessage" class="input" placeholder="Type a message..." @keyup.enter="sendChatMessage" /><button class="btn btn-primary" @click="sendChatMessage">Send</button></div></div>
                </div>
                <aside class="online-users">
                  <div class="online-users-header">Online <span class="online-count">{{ onlineUsers.filter(u => u.status === 'online').length }}</span></div>
                  <div class="online-users-list">
                    <div v-for="user in onlineUsers" :key="user.id" class="user-item">
                      <div class="user-avatar-wrapper"><div class="avatar avatar-sm">{{ getInitials(user.name) }}</div><span :class="['status-dot', 'status-' + user.status, 'user-status-indicator']"></span></div>
                      <div class="user-info"><div class="user-name">{{ user.name }}</div><div class="user-status-text">{{ user.statusText }}</div></div>
                      <div class="user-actions"><button class="user-action-btn" @click="startCall(user, 'audio')">📞</button><button class="user-action-btn" @click="startCall(user, 'video')">📹</button></div>
                    </div>
                  </div>
                </aside>
              </div>

              <!-- RADIO CHAT -->
              <div v-if="activeView === 'radio'" class="radio-chat-layout animate-fade-in">
                <aside class="agent-sidebar">
                  <div class="agent-sidebar-header"><div class="agent-sidebar-title">AI Agents</div></div>
                  <div class="agent-list">
                    <div v-for="agent in AI_AGENTS" :key="agent.id" :class="['agent-card', agent.id, { active: activeAgent === agent.id }]" @click="activeAgent = agent.id; radioMessages = []">
                      <div class="agent-icon">{{ agent.icon }}</div>
                      <div class="agent-name">{{ agent.name }}</div>
                      <div class="agent-provider">{{ agent.provider }}</div>
                      <div class="agent-status"><span class="agent-status-dot"></span>{{ agent.status }}</div>
                    </div>
                  </div>
                </aside>
                <div class="radio-chat-main">
                  <div class="radio-chat-header">
                    <div class="radio-chat-header-info"><div :class="['radio-chat-header-agent', activeAgent]">{{ AI_AGENTS.find(a => a.id === activeAgent)?.icon }} {{ AI_AGENTS.find(a => a.id === activeAgent)?.name }}</div></div>
                    <div class="flex gap-2"><button class="btn btn-secondary btn-sm">📋 Export</button><button class="btn btn-secondary btn-sm" @click="radioMessages = []">🗑️ Clear</button></div>
                  </div>
                  <div class="radio-messages">
                    <div v-if="!radioMessages.length" class="empty-state"><div class="empty-state-icon animate-float">{{ AI_AGENTS.find(a => a.id === activeAgent)?.icon }}</div><p>Start a conversation with {{ AI_AGENTS.find(a => a.id === activeAgent)?.name }}</p></div>
                    <div v-for="msg in radioMessages" :key="msg.id" :class="['radio-message', msg.role]">
                      <div :class="['radio-message-avatar', msg.role === 'user' ? 'user' : msg.agent]">{{ msg.role === 'user' ? getInitials(currentUser.name) : AI_AGENTS.find(a => a.id === msg.agent)?.icon }}</div>
                      <div class="radio-message-content">
                        <div class="radio-message-header"><span :class="['radio-message-sender', msg.role === 'user' ? '' : msg.agent]">{{ msg.role === 'user' ? 'You' : AI_AGENTS.find(a => a.id === msg.agent)?.name }}</span><span class="radio-message-time">{{ formatTime(msg.time) }}</span></div>
                        <div :class="['radio-message-bubble', msg.role === 'user' ? '' : msg.agent]"><div class="radio-message-text">{{ msg.content }}</div></div>
                        <div v-if="msg.tokens" class="radio-message-meta"><span class="radio-message-stat">📥 {{ msg.tokens.input }} tokens</span><span class="radio-message-stat">📤 {{ msg.tokens.output }} tokens</span><span class="radio-message-stat">⏱️ {{ msg.responseTime }}ms</span></div>
                      </div>
                    </div>
                    <div v-if="radioLoading" class="radio-typing"><div class="radio-typing-dots"><span :class="['radio-typing-dot', activeAgent]"></span><span :class="['radio-typing-dot', activeAgent]"></span><span :class="['radio-typing-dot', activeAgent]"></span></div><span class="radio-typing-text">{{ AI_AGENTS.find(a => a.id === activeAgent)?.name }} is thinking...</span></div>
                  </div>
                  <div class="radio-input-area">
                    <div class="radio-input-wrapper"><input v-model="radioInput" class="input radio-input" placeholder="Ask anything..." @keyup.enter="sendRadioMessage" :disabled="radioLoading" /><button class="btn btn-primary" @click="sendRadioMessage" :disabled="radioLoading || !radioInput.trim()">{{ radioLoading ? '...' : 'Send' }}</button></div>
                    <div class="radio-suggestions"><button class="radio-suggestion" @click="radioInput = 'Explain WebRTC in simple terms'">Explain WebRTC</button><button class="radio-suggestion" @click="radioInput = 'Write a sorting algorithm'">Sorting algorithm</button><button class="radio-suggestion" @click="radioInput = 'Best practices for API design'">API best practices</button></div>
                  </div>
                </div>
                <aside class="radio-history">
                  <div class="radio-history-header">Chat History</div>
                  <div class="radio-history-list">
                    <div v-for="item in radioHistory" :key="item.id" class="radio-history-item">
                      <div class="radio-history-title">{{ item.title }}</div>
                      <div class="radio-history-meta"><span class="radio-history-agent">{{ AI_AGENTS.find(a => a.id === item.agent)?.icon }} {{ AI_AGENTS.find(a => a.id === item.agent)?.name }}</span><span>{{ formatDate(item.time) }}</span></div>
                    </div>
                  </div>
                </aside>
              </div>

              <!-- TASKS -->
              <div v-if="activeView === 'tasks'" class="tasks-layout animate-fade-in">
                <aside class="tasks-sidebar">
                  <div class="tasks-filter"><div class="tasks-filter-title">Filters</div>
                    <div v-for="filter in TASK_FILTERS" :key="filter.id" :class="['tasks-filter-item', { active: taskFilter === filter.id }]" @click="taskFilter = filter.id">
                      <span>{{ filter.icon }} {{ filter.label }}</span>
                      <span class="tasks-filter-count">{{ filter.id === 'all' ? tasks.length : filter.id === 'completed' ? tasks.filter(t => t.completed).length : filter.id === 'high' ? tasks.filter(t => t.priority === 'high' && !t.completed).length : tasks.filter(t => !t.completed).length }}</span>
                    </div>
                  </div>
                </aside>
                <div class="tasks-main">
                  <div class="tasks-header"><span class="font-semibold">{{ TASK_FILTERS.find(f => f.id === taskFilter)?.label }} ({{ filteredTasks.length }})</span><button class="btn btn-primary" @click="showTaskModal = true">+ Add Task</button></div>
                  <div class="tasks-list">
                    <div v-for="task in filteredTasks" :key="task.id" :class="['task-item', { completed: task.completed }]">
                      <div class="task-header">
                        <div :class="['task-checkbox', { checked: task.completed }]" @click="toggleTask(task)">{{ task.completed ? '✓' : '' }}</div>
                        <div class="task-content"><div class="task-title">{{ task.title }}</div><div class="task-description">{{ task.description }}</div></div>
                      </div>
                      <div class="task-footer">
                        <span :class="['task-priority', task.priority]">{{ task.priority }}</span>
                        <span :class="['task-due', { overdue: new Date(task.dueDate) < new Date() && !task.completed }]">📅 {{ formatDate(task.dueDate) }}</span>
                        <div class="task-tags"><span v-for="tag in task.tags" :key="tag" class="task-tag">{{ tag }}</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- CALENDAR -->
              <div v-if="activeView === 'calendar'" class="calendar-layout animate-fade-in">
                <aside class="calendar-sidebar">
                  <button class="btn btn-primary w-full mb-4">+ New Event</button>
                  <div class="mini-calendar">
                    <div class="mini-calendar-header"><button class="btn btn-ghost btn-sm" @click="currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1)">←</button><span class="font-semibold">{{ currentMonth.toLocaleDateString([], { month: 'long', year: 'numeric' }) }}</span><button class="btn btn-ghost btn-sm" @click="currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1)">→</button></div>
                    <div class="mini-calendar-grid">
                      <div v-for="day in ['Su','Mo','Tu','We','Th','Fr','Sa']" :key="day" class="mini-calendar-weekday">{{ day }}</div>
                      <div v-for="(day, i) in calendarDays.slice(0, 35)" :key="i" :class="['mini-calendar-day', { today: day.date.toDateString() === new Date().toDateString(), 'other-month': day.otherMonth, selected: day.date.toDateString() === selectedDate.toDateString() }]" @click="selectedDate = day.date">{{ day.date.getDate() }}</div>
                    </div>
                  </div>
                  <div class="mt-4"><div class="font-semibold mb-2">Upcoming</div>
                    <div v-for="event in calendarEvents.slice(0, 5)" :key="event.id" class="flex items-center gap-2 mb-2 text-sm">
                      <span :class="['calendar-event', event.type]" style="width: 8px; height: 8px; padding: 0; border-radius: 50%"></span>
                      <span>{{ event.title }}</span>
                    </div>
                  </div>
                </aside>
                <div class="calendar-main">
                  <div class="calendar-header">
                    <div class="calendar-nav"><button class="btn btn-ghost btn-sm" @click="currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1)">← Prev</button><button class="btn btn-secondary btn-sm" @click="currentMonth = new Date()">Today</button><button class="btn btn-ghost btn-sm" @click="currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1)">Next →</button></div>
                    <h2 class="calendar-title">{{ currentMonth.toLocaleDateString([], { month: 'long', year: 'numeric' }) }}</h2>
                    <div class="flex gap-2"><button class="btn btn-secondary btn-sm">Day</button><button class="btn btn-secondary btn-sm">Week</button><button class="btn btn-primary btn-sm">Month</button></div>
                  </div>
                  <div class="calendar-grid">
                    <div v-for="day in ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']" :key="day" class="calendar-weekday-header">{{ day }}</div>
                    <div v-for="(day, i) in calendarDays" :key="i" :class="['calendar-cell', { today: day.date.toDateString() === new Date().toDateString(), 'other-month': day.otherMonth }]">
                      <div class="calendar-date">{{ day.date.getDate() }}</div>
                      <div v-for="event in getEventsForDate(day.date)" :key="event.id" :class="['calendar-event', event.type]">{{ event.title }}</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- CONTACTS -->
              <div v-if="activeView === 'contacts'" class="contacts-layout animate-fade-in">
                <div class="contacts-list">
                  <div class="contacts-header"><input v-model="contactSearch" class="input" style="flex:1" placeholder="Search contacts..." /><button class="btn btn-primary" @click="showAddContactModal = true">+ Add</button></div>
                  <div class="contacts-grid">
                    <div v-for="contact in filteredContacts" :key="contact.id" :class="['contact-card', { selected: selectedContact?.id === contact.id }]" @click="selectedContact = contact">
                      <div class="avatar">{{ getInitials(contact.name) }}</div>
                      <div class="contact-info"><div class="contact-name">{{ contact.name }}</div><div class="contact-email">{{ contact.email }}</div></div>
                    </div>
                  </div>
                </div>
                <div class="contact-detail" v-if="selectedContact">
                  <div class="contact-detail-header">
                    <div class="avatar avatar-xl contact-detail-avatar">{{ getInitials(selectedContact.name) }}</div>
                    <div class="contact-detail-name">{{ selectedContact.name }}</div>
                    <div class="contact-detail-email">{{ selectedContact.email }}</div>
                    <div class="contact-detail-actions"><button class="btn btn-primary btn-sm">📧 Email</button><button class="btn btn-success btn-sm" @click="startCall(selectedContact, 'audio')">📞 Call</button><button class="btn btn-secondary btn-sm" @click="startCall(selectedContact, 'video')">📹 Video</button></div>
                  </div>
                  <div class="contact-detail-section"><h4>Contact Info</h4>
                    <div class="contact-detail-item"><div class="contact-detail-label">Phone</div><div class="contact-detail-value">{{ selectedContact.phone }}</div></div>
                    <div class="contact-detail-item"><div class="contact-detail-label">Company</div><div class="contact-detail-value">{{ selectedContact.company }}</div></div>
                    <div class="contact-detail-item"><div class="contact-detail-label">Role</div><div class="contact-detail-value">{{ selectedContact.role }}</div></div>
                  </div>
                </div>
                <div v-else class="contact-detail empty-state" style="display:flex;align-items:center;justify-content:center"><div><div class="empty-state-icon">👤</div><p>Select a contact</p></div></div>
              </div>

              <!-- SETTINGS -->
              <div v-if="activeView === 'settings'" class="settings-layout animate-fade-in">
                <aside class="settings-sidebar">
                  <div v-for="item in SETTINGS_NAV" :key="item.id" :class="['settings-nav-item', { active: activeSettingsTab === item.id }]" @click="activeSettingsTab = item.id">{{ item.icon }} {{ item.label }}</div>
                </aside>
                <div class="settings-main">
                  <div v-if="activeSettingsTab === 'profile'" class="settings-section">
                    <h3 class="settings-section-title">Profile Settings</h3>
                    <div class="flex items-center gap-4 mb-4"><div class="avatar avatar-xl">{{ getInitials(currentUser.name) }}</div><div><button class="btn btn-secondary btn-sm">Change Photo</button></div></div>
                    <div class="mb-4"><label class="input-label">Full Name</label><input class="input" :value="currentUser.name" /></div>
                    <div class="mb-4"><label class="input-label">Email</label><input class="input" :value="currentUser.email" /></div>
                    <button class="btn btn-primary">Save Changes</button>
                  </div>
                  <div v-if="activeSettingsTab === 'notifications'" class="settings-section">
                    <h3 class="settings-section-title">Notification Settings</h3>
                    <div class="settings-item"><div class="settings-item-info"><h4>Email Notifications</h4><p>Receive email notifications for important updates</p></div><div :class="['toggle', { active: settings.emailNotifications }]" @click="settings.emailNotifications = !settings.emailNotifications"></div></div>
                    <div class="settings-item"><div class="settings-item-info"><h4>Push Notifications</h4><p>Receive push notifications in your browser</p></div><div :class="['toggle', { active: settings.pushNotifications }]" @click="settings.pushNotifications = !settings.pushNotifications"></div></div>
                    <div class="settings-item"><div class="settings-item-info"><h4>Sound Effects</h4><p>Play sounds for notifications</p></div><div :class="['toggle', { active: settings.soundEffects }]" @click="settings.soundEffects = !settings.soundEffects"></div></div>
                  </div>
                  <div v-if="activeSettingsTab === 'appearance'" class="settings-section">
                    <h3 class="settings-section-title">Appearance Settings</h3>
                    <div class="settings-item"><div class="settings-item-info"><h4>Dark Mode</h4><p>Use dark theme for the interface</p></div><div :class="['toggle', { active: settings.darkMode }]" @click="settings.darkMode = !settings.darkMode"></div></div>
                    <div class="settings-item"><div class="settings-item-info"><h4>Compact Mode</h4><p>Use compact spacing for lists</p></div><div :class="['toggle', { active: settings.compactMode }]" @click="settings.compactMode = !settings.compactMode"></div></div>
                  </div>
                  <div v-if="activeSettingsTab === 'privacy'" class="settings-section"><h3 class="settings-section-title">Privacy Settings</h3><p class="text-muted">Privacy settings coming soon...</p></div>
                  <div v-if="activeSettingsTab === 'integrations'" class="settings-section"><h3 class="settings-section-title">Integrations</h3><p class="text-muted">Manage your connected apps and services...</p></div>
                </div>
              </div>
            </div>
          </main>

          <!-- Notifications Panel -->
          <div v-if="showNotifications" class="notifications-panel">
            <div class="notifications-header"><span class="font-semibold">Notifications</span><button class="btn btn-ghost btn-sm" @click="notifications.forEach(n => n.unread = false)">Mark all read</button></div>
            <div class="notifications-list">
              <div v-for="notif in notifications" :key="notif.id" :class="['notification-item', { unread: notif.unread }]" @click="notif.unread = false">
                <div class="notification-icon" style="background: var(--bg-tertiary)">{{ notif.icon }}</div>
                <div class="notification-content"><div class="notification-title">{{ notif.title }}</div><div class="notification-text">{{ notif.text }}</div><div class="notification-time">{{ formatTime(notif.time) }}</div></div>
              </div>
            </div>
          </div>

          <!-- Compose Modal -->
          <div v-if="showComposeModal" class="modal-overlay" @click.self="showComposeModal = false">
            <div class="modal">
              <div class="modal-header"><span class="modal-title">New Email</span><button class="btn btn-icon btn-ghost" @click="showComposeModal = false">✕</button></div>
              <div class="modal-body">
                <div class="mb-4"><label class="input-label">To</label><input v-model="composeData.to" class="input" placeholder="recipient@email.com" /></div>
                <div class="mb-4"><label class="input-label">Subject</label><input v-model="composeData.subject" class="input" placeholder="Subject" /></div>
                <div class="mb-4"><label class="input-label">Message</label><textarea v-model="composeData.body" class="input" rows="8" placeholder="Write your message..."></textarea></div>
              </div>
              <div class="modal-footer"><button class="btn btn-secondary" @click="showComposeModal = false">Cancel</button><button class="btn btn-primary" :disabled="!composeData.to || !composeData.subject">Send Email</button></div>
            </div>
          </div>

          <!-- Task Modal -->
          <div v-if="showTaskModal" class="modal-overlay" @click.self="showTaskModal = false">
            <div class="modal">
              <div class="modal-header"><span class="modal-title">New Task</span><button class="btn btn-icon btn-ghost" @click="showTaskModal = false">✕</button></div>
              <div class="modal-body">
                <div class="mb-4"><label class="input-label">Title</label><input v-model="newTask.title" class="input" placeholder="Task title" /></div>
                <div class="mb-4"><label class="input-label">Description</label><textarea v-model="newTask.description" class="input" rows="3" placeholder="Task description"></textarea></div>
                <div class="flex gap-4 mb-4">
                  <div class="flex-1"><label class="input-label">Priority</label><select v-model="newTask.priority" class="input"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
                  <div class="flex-1"><label class="input-label">Due Date</label><input v-model="newTask.dueDate" type="date" class="input" /></div>
                </div>
              </div>
              <div class="modal-footer"><button class="btn btn-secondary" @click="showTaskModal = false">Cancel</button><button class="btn btn-primary" @click="addTask" :disabled="!newTask.title">Add Task</button></div>
            </div>
          </div>

          <!-- Call Overlay -->
          <div v-if="callState.active" class="call-overlay">
            <div class="call-container">
              <div class="avatar call-avatar-large">{{ callState.peer ? getInitials(callState.peer.name) : '?' }}</div>
              <div class="call-name">{{ callState.peer?.name }}</div>
              <div class="call-status-text">{{ callState.status === 'connected' ? (callState.type === 'video' ? 'Video Call' : 'Audio Call') : 'Calling...' }}</div>
              <div class="call-timer">{{ formatCallTime(callState.duration) }}</div>
              <div class="call-actions">
                <button :class="['call-btn', 'call-btn-mute', { active: callState.muted }]" @click="toggleMute">{{ callState.muted ? '🔇' : '🎤' }}</button>
                <button class="call-btn call-btn-end" @click="endCall">📵</button>
                <button v-if="callState.type === 'video'" class="call-btn" style="background: var(--bg-elevated); color: white">📹</button>
              </div>
            </div>
          </div>

          <!-- Incoming Call -->
          <div v-if="incomingCall" class="incoming-call">
            <div class="incoming-call-header"><div class="avatar">{{ getInitials(incomingCall.caller.name) }}</div><div class="incoming-call-info"><div class="incoming-call-name">{{ incomingCall.caller.name }}</div><div class="incoming-call-type">{{ incomingCall.type === 'video' ? '📹 Video' : '📞 Audio' }} Call</div></div></div>
            <div class="incoming-call-actions"><button class="btn btn-danger" @click="rejectCall">Decline</button><button class="btn btn-success" @click="answerCall">Answer</button></div>
          </div>

          <!-- Toasts -->
          <div class="toast-container"><div v-for="toast in toasts" :key="toast.id" :class="['toast', 'toast-' + toast.type]">{{ toast.message }}</div></div>
        </div>
      `
    };

    createApp(App).mount('#app');
  </script>
</body>
</html>

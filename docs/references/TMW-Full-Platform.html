<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TMW Engine Full Platform">
  <title>TMW Engine - Full Platform</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; color: var(--text-primary); background: var(--bg-primary); }

    :root {
      /* Core Colors */
      --color-primary: hsl(239, 84%, 67%);
      --color-primary-hover: hsl(239, 84%, 60%);
      --color-primary-light: hsl(239, 84%, 95%);
      --color-success: hsl(142, 70%, 45%);
      --color-warning: hsl(38, 92%, 50%);
      --color-danger: hsl(0, 84%, 60%);
      --color-info: hsl(200, 80%, 50%);

      /* AI Agent Colors */
      --claude-primary: hsl(25, 95%, 53%);
      --claude-secondary: hsl(25, 80%, 45%);
      --claude-gradient: linear-gradient(135deg, hsl(25, 95%, 53%), hsl(35, 90%, 60%));
      --gpt-primary: hsl(160, 84%, 39%);
      --gpt-secondary: hsl(160, 70%, 32%);
      --gpt-gradient: linear-gradient(135deg, hsl(160, 84%, 39%), hsl(170, 80%, 45%));
      --gemini-primary: hsl(217, 91%, 60%);
      --gemini-secondary: hsl(280, 70%, 55%);
      --gemini-gradient: linear-gradient(135deg, hsl(217, 91%, 60%), hsl(280, 70%, 55%));

      /* Background */
      --bg-primary: hsl(222, 47%, 11%);
      --bg-secondary: hsl(222, 41%, 15%);
      --bg-tertiary: hsl(222, 35%, 19%);
      --bg-elevated: hsl(222, 30%, 23%);

      /* Text */
      --text-primary: hsl(210, 40%, 98%);
      --text-secondary: hsl(215, 20%, 65%);
      --text-muted: hsl(215, 15%, 45%);

      /* Border */
      --border-default: hsl(222, 20%, 25%);
      --border-light: hsl(222, 15%, 20%);

      /* Spacing */
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;

      /* Radius */
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-full: 9999px;

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.4);
      --shadow-glow-claude: 0 0 30px rgba(251, 146, 60, 0.4);
      --shadow-glow-gpt: 0 0 30px rgba(34, 197, 94, 0.4);
      --shadow-glow-gemini: 0 0 30px rgba(99, 102, 241, 0.4);

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 300ms ease;
      --transition-slow: 500ms ease;

      /* Z-Index */
      --z-dropdown: 100; --z-modal: 200; --z-toast: 300;
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes glow { 0%, 100% { box-shadow: var(--shadow-glow); } 50% { box-shadow: 0 0 50px rgba(99, 102, 241, 0.6); } }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes stream { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes borderGlow { 0%, 100% { border-color: var(--color-primary); } 50% { border-color: var(--claude-primary); } }

    .animate-fade-in { animation: fadeIn var(--transition-normal) ease-out; }
    .animate-slide-in { animation: slideIn var(--transition-normal) ease-out; }
    .animate-slide-up { animation: slideUp var(--transition-normal) ease-out; }
    .animate-pulse { animation: pulse 2s infinite; }
    .animate-glow { animation: glow 2s infinite; }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }

    /* Layout */
    .app-container { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 72px; background: var(--bg-secondary); border-right: 1px solid var(--border-default); display: flex; flex-direction: column; align-items: center; padding: var(--space-4) 0; gap: var(--space-1); }
    .nav-item { width: 48px; height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-fast); color: var(--text-secondary); background: transparent; border: none; font-size: 1.25rem; position: relative; }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); transform: scale(1.05); }
    .nav-item.active { background: var(--color-primary); color: white; box-shadow: var(--shadow-glow); }
    .nav-badge { position: absolute; top: 2px; right: 2px; background: var(--color-danger); color: white; font-size: 0.625rem; min-width: 18px; height: 18px; padding: 0 4px; border-radius: var(--radius-full); font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .nav-divider { width: 32px; height: 1px; background: var(--border-default); margin: var(--space-2) 0; }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { height: 64px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-5); }
    .header-title { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: var(--space-3); }
    .header-actions { display: flex; gap: var(--space-3); align-items: center; }
    .content-area { flex: 1; overflow-y: auto; padding: var(--space-5); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all var(--transition-fast); border: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--color-primary); color: white; }
    .btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-glow); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-default); }
    .btn-secondary:hover { background: var(--bg-elevated); }
    .btn-success { background: var(--color-success); color: white; }
    .btn-danger { background: var(--color-danger); color: white; }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-full); }
    .btn-sm { padding: var(--space-1) var(--space-3); font-size: 0.75rem; }
    .btn-lg { padding: var(--space-3) var(--space-5); font-size: 1rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cards */
    .card { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; }
    .card-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .card-body { padding: var(--space-4); }

    /* Input */
    .input { width: 100%; padding: var(--space-3) var(--space-4); background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.875rem; transition: all var(--transition-fast); }
    .input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    .input::placeholder { color: var(--text-muted); }
    textarea.input { min-height: 100px; resize: vertical; font-family: inherit; }
    .input-label { display: block; margin-bottom: var(--space-1); font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; }

    /* Avatar */
    .avatar { width: 40px; height: 40px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--color-primary), var(--color-info)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.875rem; flex-shrink: 0; }
    .avatar-sm { width: 32px; height: 32px; font-size: 0.75rem; }
    .avatar-lg { width: 48px; height: 48px; font-size: 1rem; }
    .avatar-xl { width: 64px; height: 64px; font-size: 1.25rem; }

    /* Badge */
    .badge { display: inline-flex; align-items: center; padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 500; }
    .badge-primary { background: var(--color-primary); color: white; }
    .badge-success { background: var(--color-success); color: white; }
    .badge-warning { background: var(--color-warning); color: black; }
    .badge-danger { background: var(--color-danger); color: white; }
    .badge-info { background: var(--color-info); color: white; }
    .badge-outline { background: transparent; border: 1px solid var(--border-default); color: var(--text-secondary); }

    /* Status */
    .status-dot { width: 10px; height: 10px; border-radius: var(--radius-full); }
    .status-online { background: var(--color-success); }
    .status-busy { background: var(--color-danger); }
    .status-away { background: var(--color-warning); }
    .status-offline { background: var(--text-muted); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: var(--z-modal); animation: fadeIn var(--transition-fast); backdrop-filter: blur(4px); }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-xl); width: 90%; max-width: 600px; max-height: 90vh; overflow: hidden; animation: slideUp var(--transition-normal); }
    .modal-lg { max-width: 900px; }
    .modal-header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.125rem; font-weight: 600; }
    .modal-body { padding: var(--space-5); overflow-y: auto; max-height: calc(90vh - 140px); }
    .modal-footer { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-default); display: flex; justify-content: flex-end; gap: var(--space-3); }

    /* Toast */
    .toast-container { position: fixed; bottom: var(--space-5); right: var(--space-5); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--space-2); }
    .toast { background: var(--bg-elevated); border: 1px solid var(--border-default); padding: var(--space-4); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); animation: slideUp var(--transition-normal); display: flex; align-items: center; gap: var(--space-3); min-width: 300px; }
    .toast-success { border-left: 4px solid var(--color-success); }
    .toast-error { border-left: 4px solid var(--color-danger); }
    .toast-info { border-left: 4px solid var(--color-info); }

    /* Tabs */
    .tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border-default); margin-bottom: var(--space-4); }
    .tab { padding: var(--space-3) var(--space-4); cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all var(--transition-fast); background: none; border-top: none; border-left: none; border-right: none; font-size: 0.875rem; font-weight: 500; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

    /* Empty State */
    .empty-state { text-align: center; padding: var(--space-6); color: var(--text-muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: var(--space-4); opacity: 0.5; }

    /* Dashboard */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-5); }
    .stat-card { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; align-items: center; gap: var(--space-4); transition: all var(--transition-fast); }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--color-primary); }
    .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .stat-value { font-size: 1.75rem; font-weight: 700; }
    .stat-label { font-size: 0.875rem; color: var(--text-secondary); }

    /* ==========================================
       RADIO CHAT MODULE
       ========================================== */
    .radio-chat-layout { display: grid; grid-template-columns: 280px 1fr 300px; gap: var(--space-4); height: calc(100vh - 140px); }

    /* Agent Sidebar */
    .agent-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .agent-sidebar-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); }
    .agent-sidebar-title { font-weight: 600; margin-bottom: var(--space-3); }
    .agent-list { flex: 1; padding: var(--space-3); overflow-y: auto; }

    .agent-card { padding: var(--space-4); border-radius: var(--radius-lg); margin-bottom: var(--space-3); cursor: pointer; transition: all var(--transition-fast); border: 2px solid transparent; position: relative; overflow: hidden; }
    .agent-card::before { content: ''; position: absolute; inset: 0; opacity: 0.1; transition: opacity var(--transition-fast); }
    .agent-card:hover::before { opacity: 0.2; }
    .agent-card.active { border-color: currentColor; }
    .agent-card.active::before { opacity: 0.15; }

    .agent-card.claude { background: linear-gradient(135deg, rgba(251, 146, 60, 0.1), rgba(251, 146, 60, 0.05)); color: var(--claude-primary); }
    .agent-card.claude::before { background: var(--claude-gradient); }
    .agent-card.claude.active { box-shadow: var(--shadow-glow-claude); }

    .agent-card.gpt { background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05)); color: var(--gpt-primary); }
    .agent-card.gpt::before { background: var(--gpt-gradient); }
    .agent-card.gpt.active { box-shadow: var(--shadow-glow-gpt); }

    .agent-card.gemini { background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.05)); color: var(--gemini-primary); }
    .agent-card.gemini::before { background: var(--gemini-gradient); }
    .agent-card.gemini.active { box-shadow: var(--shadow-glow-gemini); }

    .agent-icon { font-size: 2rem; margin-bottom: var(--space-2); }
    .agent-name { font-weight: 600; font-size: 1rem; }
    .agent-provider { font-size: 0.75rem; opacity: 0.7; }
    .agent-status { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); font-size: 0.75rem; }
    .agent-status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }

    /* Chat Main */
    .radio-chat-main { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .radio-chat-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .radio-chat-header-info { display: flex; align-items: center; gap: var(--space-3); }
    .radio-chat-header-agent { display: flex; align-items: center; gap: var(--space-2); }
    .radio-chat-header-agent.claude { color: var(--claude-primary); }
    .radio-chat-header-agent.gpt { color: var(--gpt-primary); }
    .radio-chat-header-agent.gemini { color: var(--gemini-primary); }

    .radio-messages { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

    /* Radio Message Bubble */
    .radio-message { display: flex; gap: var(--space-3); animation: fadeIn var(--transition-normal); }
    .radio-message.user { flex-direction: row-reverse; }

    .radio-message-avatar { width: 44px; height: 44px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; position: relative; }
    .radio-message-avatar.claude { background: var(--claude-gradient); box-shadow: var(--shadow-glow-claude); }
    .radio-message-avatar.gpt { background: var(--gpt-gradient); box-shadow: var(--shadow-glow-gpt); }
    .radio-message-avatar.gemini { background: var(--gemini-gradient); box-shadow: var(--shadow-glow-gemini); }
    .radio-message-avatar.user { background: linear-gradient(135deg, var(--color-primary), var(--color-info)); }

    .radio-message-content { flex: 1; max-width: 75%; }
    .radio-message-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); }
    .radio-message-sender { font-weight: 600; font-size: 0.875rem; }
    .radio-message-sender.claude { color: var(--claude-primary); }
    .radio-message-sender.gpt { color: var(--gpt-primary); }
    .radio-message-sender.gemini { color: var(--gemini-primary); }
    .radio-message-time { font-size: 0.75rem; color: var(--text-muted); }

    .radio-message-bubble { background: var(--bg-tertiary); padding: var(--space-4); border-radius: var(--radius-lg); border-top-left-radius: var(--radius-sm); position: relative; }
    .radio-message.user .radio-message-bubble { background: var(--color-primary); color: white; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-sm); }
    .radio-message-bubble.claude { border-left: 3px solid var(--claude-primary); }
    .radio-message-bubble.gpt { border-left: 3px solid var(--gpt-primary); }
    .radio-message-bubble.gemini { border-left: 3px solid var(--gemini-primary); }

    .radio-message-text { font-size: 0.9rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .radio-message-text code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: var(--radius-sm); font-family: 'Monaco', monospace; font-size: 0.85em; }
    .radio-message-text pre { background: rgba(0,0,0,0.3); padding: var(--space-3); border-radius: var(--radius-md); overflow-x: auto; margin: var(--space-3) 0; }

    .radio-message-meta { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-2); font-size: 0.75rem; color: var(--text-muted); }
    .radio-message-stat { display: flex; align-items: center; gap: var(--space-1); }

    /* Typing Indicator */
    .radio-typing { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); }
    .radio-typing-dots { display: flex; gap: 4px; }
    .radio-typing-dot { width: 8px; height: 8px; border-radius: 50%; animation: typing 1.4s infinite; }
    .radio-typing-dot.claude { background: var(--claude-primary); }
    .radio-typing-dot.gpt { background: var(--gpt-primary); }
    .radio-typing-dot.gemini { background: var(--gemini-primary); }
    .radio-typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .radio-typing-dot:nth-child(3) { animation-delay: 0.4s; }
    .radio-typing-text { font-size: 0.875rem; color: var(--text-secondary); }

    /* Streaming Indicator */
    .streaming-indicator { display: inline-flex; align-items: center; gap: var(--space-2); }
    .streaming-indicator::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 0.8s infinite; }

    /* Input Area */
    .radio-input-area { padding: var(--space-4); border-top: 1px solid var(--border-light); }
    .radio-input-wrapper { display: flex; gap: var(--space-3); align-items: flex-end; }
    .radio-input-actions { display: flex; gap: var(--space-1); }
    .radio-input { flex: 1; }
    .radio-suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .radio-suggestion { padding: var(--space-2) var(--space-3); background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-full); font-size: 0.75rem; cursor: pointer; transition: all var(--transition-fast); }
    .radio-suggestion:hover { border-color: var(--color-primary); background: var(--bg-elevated); }

    /* History Sidebar */
    .radio-history { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .radio-history-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); font-weight: 600; }
    .radio-history-list { flex: 1; overflow-y: auto; padding: var(--space-3); }
    .radio-history-item { padding: var(--space-3); background: var(--bg-tertiary); border-radius: var(--radius-md); margin-bottom: var(--space-2); cursor: pointer; transition: all var(--transition-fast); }
    .radio-history-item:hover { background: var(--bg-elevated); }
    .radio-history-title { font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .radio-history-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .radio-history-agent { display: flex; align-items: center; gap: var(--space-1); }

    /* ==========================================
       TASKS / ACTIVITIES MODULE
       ========================================== */
    .tasks-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-4); height: calc(100vh - 140px); }

    .tasks-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-4); overflow-y: auto; }
    .tasks-filter { margin-bottom: var(--space-4); }
    .tasks-filter-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.5px; }

    .task-item { background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-3); transition: all var(--transition-fast); cursor: pointer; }

    .task-header { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-2); }
    .task-checkbox { width: 20px; height: 20px; border-radius: var(--radius-sm); border: 2px solid var(--border-default); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast); flex-shrink: 0; margin-top: 2px; }
    .task-checkbox:hover { border-color: var(--color-primary); }

    .task-content { flex: 1; }
    .task-title { font-weight: 500; margin-bottom: var(--space-1); }
    .task-description { font-size: 0.875rem; color: var(--text-secondary); }

    .task-footer { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); }

    .task-priority.high { background: rgba(239, 68, 68, 0.2); color: var(--color-danger); }
    .task-priority.medium { background: rgba(251, 191, 36, 0.2); color: var(--color-warning); }

    /* ==========================================
       CALENDAR MODULE
       ========================================== */
    .calendar-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-4); height: calc(100vh - 140px); }

    .calendar-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-4); overflow-y: auto; }

    .mini-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .mini-calendar-day { padding: var(--space-2); font-size: 0.75rem; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); }
    .mini-calendar-day:hover { background: var(--bg-tertiary); }
    .mini-calendar-day.today { background: var(--color-primary); color: white; }
    .mini-calendar-day.selected { border: 2px solid var(--color-primary); }
    .mini-calendar-day.other-month { color: var(--text-muted); }
    .mini-calendar-weekday { font-size: 0.625rem; color: var(--text-muted); padding: var(--space-1); }

    .calendar-main { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .calendar-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .calendar-nav { display: flex; align-items: center; gap: var(--space-3); }
    .calendar-title { font-size: 1.25rem; font-weight: 600; }

    .calendar-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); overflow: hidden; }
    .calendar-weekday-header { padding: var(--space-3); text-align: center; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid var(--border-light); font-weight: 500; }
    .calendar-cell { border: 1px solid var(--border-light); padding: var(--space-2); min-height: 100px; transition: all var(--transition-fast); }
    .calendar-cell:hover { background: var(--bg-tertiary); }
    .calendar-cell.today { background: rgba(99, 102, 241, 0.1); }
    .calendar-cell.other-month { opacity: 0.5; }
    .calendar-date { font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-2); }
    .calendar-event { font-size: 0.75rem; padding: 2px 6px; border-radius: var(--radius-sm); margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calendar-event.meeting { background: var(--color-primary); color: white; }
    .calendar-event.task { background: var(--color-success); color: white; }
    .calendar-event.reminder { background: var(--color-warning); color: black; }

    /* ==========================================
       EMAIL MODULE (Improved)

    .email-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-4); overflow-y: auto; }

    .email-folder { padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-1); transition: all var(--transition-fast); color: var(--text-secondary); }
    .email-folder:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .email-folder.active { background: var(--color-primary); color: white; }
    .email-folder-count { margin-left: auto; font-size: 0.75rem; padding: 2px 8px; background: rgba(255,255,255,0.2); border-radius: var(--radius-full); }

    .email-list { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .email-list-header { padding: var(--space-3); border-bottom: 1px solid var(--border-light); }
    .email-list-content { flex: 1; overflow-y: auto; }
    .email-item { padding: var(--space-4); border-bottom: 1px solid var(--border-light); cursor: pointer; transition: all var(--transition-fast); display: flex; gap: var(--space-3); }

    .email-item-content { flex: 1; min-width: 0; }
    .email-sender { font-size: 0.875rem; margin-bottom: 2px; }

    .email-item.active .email-preview { color: rgba(255,255,255,0.7); }
    .email-time { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    .email-item.active .email-time { color: rgba(255,255,255,0.7); }

    .email-detail { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .email-detail-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); }
    .email-detail-subject { font-size: 1.25rem; font-weight: 600; margin-bottom: var(--space-3); }
    .email-detail-meta { display: flex; align-items: center; gap: var(--space-3); }
    .email-detail-actions { padding: var(--space-3); border-bottom: 1px solid var(--border-light); display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .email-detail-body { flex: 1; padding: var(--space-4); overflow-y: auto; line-height: 1.7; }
    .email-attachments { padding: var(--space-4); border-top: 1px solid var(--border-light); }
    .email-attachment { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--bg-tertiary); border-radius: var(--radius-md); margin-right: var(--space-2); margin-bottom: var(--space-2); font-size: 0.875rem; cursor: pointer; transition: all var(--transition-fast); }
    .email-attachment:hover { background: var(--bg-elevated); }

    /* ==========================================
       CHAT MODULE
       ========================================== */
    .chat-layout { display: grid; grid-template-columns: 260px 1fr 260px; gap: var(--space-4); height: calc(100vh - 140px); }
    .chat-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .chat-sidebar-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .chat-rooms-list { flex: 1; overflow-y: auto; padding: var(--space-2); }
    .chat-room-item { padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-1); transition: all var(--transition-fast); }
    .chat-room-item:hover { background: var(--bg-tertiary); }
    .chat-room-item.active { background: var(--color-primary); color: white; }
    .chat-room-icon { font-size: 1.25rem; }
    .chat-room-info { flex: 1; min-width: 0; }
    .chat-room-name { font-weight: 500; font-size: 0.875rem; }
    .chat-room-last { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-room-item.active .chat-room-last { color: rgba(255,255,255,0.7); }
    .chat-room-badge { background: var(--color-danger); color: white; font-size: 0.625rem; padding: 2px 6px; border-radius: var(--radius-full); }

    .chat-main { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
    .message { display: flex; gap: var(--space-3); max-width: 75%; animation: fadeIn var(--transition-normal); }
    .message.own { flex-direction: row-reverse; margin-left: auto; }
    .message-content { background: var(--bg-tertiary); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); border-top-left-radius: var(--radius-sm); }
    .message.own .message-content { background: var(--color-primary); color: white; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-sm); }
    .message-sender { font-size: 0.75rem; font-weight: 600; margin-bottom: var(--space-1); color: var(--text-secondary); }

    .message-text { font-size: 0.875rem; line-height: 1.5; }
    .message-time { font-size: 0.625rem; color: var(--text-muted); margin-top: var(--space-1); }

    .typing-indicator { display: flex; gap: 4px; padding: var(--space-2) var(--space-3); background: var(--bg-tertiary); border-radius: var(--radius-lg); width: fit-content; }

    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    .chat-input-area { padding: var(--space-4); border-top: 1px solid var(--border-light); }
    .chat-input-wrapper { display: flex; gap: var(--space-3); align-items: flex-end; }

    .online-users { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .online-users-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); font-weight: 600; display: flex; align-items: center; gap: var(--space-2); }
    .online-count { background: var(--color-success); color: white; padding: 2px 8px; border-radius: var(--radius-full); font-size: 0.75rem; }
    .online-users-list { flex: 1; overflow-y: auto; padding: var(--space-2); }
    .user-item { padding: var(--space-3); border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-1); transition: all var(--transition-fast); }
    .user-item:hover { background: var(--bg-tertiary); }
    .user-avatar-wrapper { position: relative; }
    .user-status-indicator { position: absolute; bottom: -2px; right: -2px; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 500; font-size: 0.875rem; }
    .user-status-text { font-size: 0.75rem; color: var(--text-secondary); }
    .user-actions { display: flex; gap: var(--space-1); }
    .user-action-btn { width: 28px; height: 28px; border-radius: var(--radius-full); border: none; background: var(--bg-elevated); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all var(--transition-fast); }
    .user-action-btn:hover { background: var(--color-primary); color: white; }

    /* ==========================================
       SETTINGS MODULE
       ========================================== */
    .settings-layout { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-4); height: calc(100vh - 140px); }
    .settings-sidebar { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-4); }
    .settings-nav-item { padding: var(--space-3); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-1); transition: all var(--transition-fast); color: var(--text-secondary); }
    .settings-nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .settings-nav-item.active { background: var(--color-primary); color: white; }

    .settings-main { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-5); overflow-y: auto; }
    .settings-section { margin-bottom: var(--space-6); }
    .settings-section-title { font-size: 1.125rem; font-weight: 600; margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border-light); }
    .settings-item { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) 0; border-bottom: 1px solid var(--border-light); }
    .settings-item:last-child { border-bottom: none; }
    .settings-item-info h4 { font-weight: 500; margin-bottom: var(--space-1); }
    .settings-item-info p { font-size: 0.875rem; color: var(--text-secondary); }

    .toggle { width: 48px; height: 26px; background: var(--bg-tertiary); border-radius: var(--radius-full); position: relative; cursor: pointer; transition: all var(--transition-fast); }
    .toggle.active { background: var(--color-primary); }
    .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: all var(--transition-fast); }
    .toggle.active::after { left: 25px; }

    /* ==========================================
       CONTACTS MODULE
       ========================================== */
    .contacts-layout { display: grid; grid-template-columns: 1fr 350px; gap: var(--space-4); height: calc(100vh - 140px); }
    .contacts-list { background: var(--bg-secondary); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
    .contacts-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; gap: var(--space-3); }
    .contacts-grid { flex: 1; overflow-y: auto; padding: var(--space-4); display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-3); align-content: start; }
    .contact-card { background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-4); cursor: pointer; transition: all var(--transition-fast); display: flex; align-items: center; gap: var(--space-3); }
    .contact-card:hover { border-color: var(--color-primary); transform: translateY(-2px); }
    .contact-card.selected { border-color: var(--color-primary); background: rgba(99, 102, 241, 0.1); }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: 600; margin-bottom: 2px; }
    .contact-email { font-size: 0.875rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .contact-detail { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: var(--space-5); overflow-y: auto; }
    .contact-detail-header { text-align: center; margin-bottom: var(--space-5); }
    .contact-detail-avatar { margin: 0 auto var(--space-4); }
    .contact-detail-name { font-size: 1.25rem; font-weight: 600; margin-bottom: var(--space-1); }
    .contact-detail-email { color: var(--text-secondary); }
    .contact-detail-actions { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-4); }
    .contact-detail-section { margin-top: var(--space-5); }
    .contact-detail-section h4 { font-size: 0.875rem; color: var(--text-muted); margin-bottom: var(--space-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .contact-detail-item { padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); }
    .contact-detail-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
    .contact-detail-value { font-size: 0.875rem; }

    /* ==========================================
       NOTIFICATIONS
       ========================================== */
    .notifications-panel { position: fixed; top: 64px; right: var(--space-4); width: 380px; max-height: calc(100vh - 100px); background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: var(--z-dropdown); animation: slideIn var(--transition-normal); overflow: hidden; }
    .notifications-header { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .notifications-list { max-height: 400px; overflow-y: auto; }
    .notification-item { padding: var(--space-4); border-bottom: 1px solid var(--border-light); display: flex; gap: var(--space-3); cursor: pointer; transition: all var(--transition-fast); }
    .notification-item:hover { background: var(--bg-tertiary); }
    .notification-item.unread { background: rgba(99, 102, 241, 0.05); }
    .notification-icon { width: 40px; height: 40px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .notification-content { flex: 1; }
    .notification-title { font-weight: 500; margin-bottom: 2px; }
    .notification-text { font-size: 0.875rem; color: var(--text-secondary); }
    .notification-time { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-1); }

    /* ==========================================
       CALL OVERLAY
       ========================================== */
    .call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: var(--z-modal); animation: fadeIn var(--transition-normal); }
    .call-container { text-align: center; color: white; }
    .call-avatar-large { width: 120px; height: 120px; margin: 0 auto var(--space-5); font-size: 3rem; animation: float 3s ease-in-out infinite; }
    .call-name { font-size: 1.5rem; font-weight: 600; margin-bottom: var(--space-2); }
    .call-status-text { color: var(--text-secondary); margin-bottom: var(--space-6); }
    .call-timer { font-size: 2.5rem; font-weight: 300; margin-bottom: var(--space-6); font-variant-numeric: tabular-nums; }
    .call-actions { display: flex; gap: var(--space-4); justify-content: center; }
    .call-btn { width: 64px; height: 64px; border-radius: var(--radius-full); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: all var(--transition-fast); }
    .call-btn:hover { transform: scale(1.1); }
    .call-btn-end { background: var(--color-danger); color: white; }
    .call-btn-mute { background: var(--bg-elevated); color: white; }
    .call-btn-mute.active { background: var(--color-warning); color: black; }

    .incoming-call { position: fixed; top: var(--space-5); right: var(--space-5); background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-xl); padding: var(--space-5); z-index: var(--z-toast); animation: slideUp var(--transition-normal), glow 2s infinite; min-width: 320px; }
    .incoming-call-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .incoming-call-info { flex: 1; }
    .incoming-call-name { font-weight: 600; }
    .incoming-call-type { font-size: 0.875rem; color: var(--text-secondary); }
